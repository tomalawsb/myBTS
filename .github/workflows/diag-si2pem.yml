name: Diagnose SI2PEM public endpoints
on:
  push:
    branches: [bts-asystent-apk-1.0]
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --silent xlsx@0.18.5
      - run: node tools/inspect-si2pem.mjs
