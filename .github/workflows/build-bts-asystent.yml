name: Build BTS Asystent PL APK

on:
  push:
    branches: [bts-asystent-apk-1.0]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Przygotuj web app i bazę BTS
        shell: bash
        run: |
          set -e
          ASSETS=android-bts/app/src/main/assets
          mkdir -p "$ASSETS"
          cp index.html app.js data-worker.js style.css manifest.json service-worker.js icon-192.png icon-512.png icon.svg "$ASSETS"/
          python -m pip install --quiet brotli
          python - <<'PY'
          import brotli, pathlib
          src=pathlib.Path('stations.json.br')
          out=pathlib.Path('android-bts/app/src/main/assets/stations.json')
          out.write_bytes(brotli.decompress(src.read_bytes()))
          print('stations.json:', out.stat().st_size, 'bytes')
          PY

          # Wzbogacenie bazy o bieżące parametry pozwoleń UKE: ERP, azymut,
          # wysokość anteny, elewację i promień obszaru, gdy są publikowane.
          npm install --no-save --silent xlsx@0.18.5
          node tools/enrich-uke.mjs "$ASSETS/stations.json" || true

          # W APK włączamy aktualizację UKE online. Gdy przeglądarka blokuje CORS,
          # app.js korzysta z natywnego pobierania AndroidNative.
          python - <<'PY'
          from pathlib import Path
          p=Path('android-bts/app/src/main/assets/app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const UKE_ONLINE_IMPORT_ENABLED = false;', 'const UKE_ONLINE_IMPORT_ENABLED = true;')
          needle="""  } catch (err) {
            throw new Error(`${sourceNameFromUrlSafe(url)}: ${err.message}. Publiczne CORS-proxy są wyłączone; użyj bezpośredniego linku z prawidłowym CORS albo importu ręcznego.`);
          }
        }
"""
          repl="""  } catch (err) {
            try {
              if (window.AndroidNative) {
                const binary = /spreadsheet|excel|octet-stream/i.test(accept);
                if (binary && AndroidNative.fetchBase64) {
                  const b64 = AndroidNative.fetchBase64(url);
                  if (b64) {
                    const raw = atob(b64);
                    const bytes = new Uint8Array(raw.length);
                    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
                    return new Response(bytes, { status: 200 });
                  }
                } else if (AndroidNative.fetchText) {
                  const text = AndroidNative.fetchText(url);
                  if (text) return new Response(text, { status: 200 });
                }
              }
            } catch (_) {}
            throw new Error(`${sourceNameFromUrlSafe(url)}: ${err.message}. Pobieranie z UKE nie powiodło się.`);
          }
        }
"""
          if needle in s:
              s=s.replace(needle,repl)
          else:
              print('UWAGA: nie znaleziono bloku CORS do podmiany')
          p.write_text(s,encoding='utf-8')
          PY

          # Addony muszą być po app.js; inaczej nadpisania funkcji nic nie robią.
          python - <<'PY'
          from pathlib import Path
          p=Path('android-bts/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          for name in ['terrain-addon.js','ui-addon.js','radio13-core.js','radio13-ui.js','radio13-events.js']:
              s=s.replace(f'<script src="{name}"></script>', '')
              s=s.replace(f'<script src="{name}" defer></script>', '')
          anchor='<script src="app.js" defer></script>'
          addons='''<script src="terrain-addon.js" defer></script>\n<script src="ui-addon.js" defer></script>\n<script src="radio13-core.js" defer></script>\n<script src="radio13-ui.js" defer></script>\n<script src="radio13-events.js" defer></script>'''
          if anchor not in s:
              raise SystemExit('Brak app.js w index.html')
          s=s.replace(anchor, anchor+'\n'+addons)
          p.write_text(s, encoding='utf-8')
          PY

          test -s "$ASSETS/stations.json"
          test -s "$ASSETS/terrain-addon.js"
          test -s "$ASSETS/ui-addon.js"
          test -s "$ASSETS/radio13-core.js"
          test -s "$ASSETS/radio13-ui.js"
          test -s "$ASSETS/radio13-events.js"
          node --check "$ASSETS/app.js"
          node --check "$ASSETS/terrain-addon.js"
          node --check "$ASSETS/ui-addon.js"
          node --check "$ASSETS/radio13-core.js"
          node --check "$ASSETS/radio13-ui.js"
          node --check "$ASSETS/radio13-events.js"
          python - <<'PY'
          import json
          p='android-bts/app/src/main/assets/stations.json'
          data=json.load(open(p,encoding='utf-8'))
          rich=sum(bool(x.get('radio_sectors')) for x in data)
          power=sum(any(s.get('eirp_dbm') is not None or s.get('erp_dbw') is not None for s in x.get('radio_sectors',[])) for x in data)
          print('Baza finalna:',len(data),'stacji; radio_sectors:',rich,'; z mocą:',power)
          PY

      - name: Android SDK
        shell: bash
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" -o /tmp/android-cmdline.zip
          unzip -q /tmp/android-cmdline.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Zbuduj APK
        working-directory: android-bts
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Przygotuj artefakt
        shell: bash
        run: |
          mkdir -p android-bts/dist
          cp android-bts/app/build/outputs/apk/debug/app-debug.apk android-bts/dist/BTS-Asystent-PL-1.3.apk
          sha256sum android-bts/dist/BTS-Asystent-PL-1.3.apk > android-bts/dist/SHA256SUMS.txt
          ls -lh android-bts/dist/BTS-Asystent-PL-1.3.apk

      - name: Wgraj APK
        uses: actions/upload-artifact@v4
        with:
          name: BTS-Asystent-PL-1.3
          path: |
            android-bts/dist/BTS-Asystent-PL-1.3.apk
            android-bts/dist/SHA256SUMS.txt
          retention-days: 30
